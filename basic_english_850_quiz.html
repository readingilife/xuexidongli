<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic English 850 - 背单词</title>
    <link rel="icon" type="image/svg+xml" href="icon/学习.svg">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #48bb78;
            --error: #f56565;
            --text: #2d3748;
            --text-light: #718096;
            --bg: #f7fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #edf2f7 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p {
            color: var(--text-light);
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 24px;
            border: 2px solid var(--border);
            background: var(--card);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text);
        }
        .nav-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
            box-shadow: var(--shadow-lg);
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            font-size: 13px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card {
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 40px;
            margin-bottom: 20px;
            text-align: center;
        }
        .question-type {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .question {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .question-phonetic {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .listen-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .listen-btn:hover {
            transform: scale(1.05);
        }
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .option {
            padding: 18px;
            border: 2px solid var(--border);
            background: var(--card);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .option:hover:not(.correct):not(.wrong) {
            border-color: var(--primary);
            background: #f0f4ff;
            transform: translateY(-2px);
        }
        .option.correct {
            border-color: var(--success);
            background: #f0fff4;
            color: #22543d;
        }
        .option.wrong {
            border-color: var(--error);
            background: #fff5f5;
            color: #742a2a;
        }
        .input-container {
            margin-top: 30px;
        }
        .input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }
        .input:focus {
            border-color: var(--primary);
        }
        .submit-btn {
            margin-top: 15px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #f0fff4;
            color: #22543d;
            border: 2px solid var(--success);
        }
        .feedback.wrong {
            background: #fff5f5;
            color: #742a2a;
            border: 2px solid var(--error);
        }
        .feedback h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .next-btn {
            margin-top: 20px;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .next-btn:hover {
            transform: translateY(-2px);
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--primary);
        }
        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 30px 20px;
            }
            .question {
                font-size: 26px;
            }
            .stats-bar {
                gap: 20px;
            }
        }
    </style>
</head>

        </div>
        <div class="stats-bar">

            <div class="stat">

        <div class="card" id="quizCard">

            <div class="question-phonetic" id="phonetic"></div>
            <button class="listen-btn" id="listenBtn" style="display: none;">🔊 听发音</button>
            <div class="options" id="options"></div>
            <div class="input-container" id="inputContainer" style="display: none;">

            </div>
            <div class="feedback" id="feedback">

                <p id="feedbackText"></p>
            </div>
            <button class="next-btn" id="nextBtn" style="display: none;">下一题 →</button>
        </div>
        <div style="text-align: center;">
            <a href="basic_english_850.html" class="back-link">← 返回单词列表</a>
        </div>
    </div>

        let mode = 1;
        let currentWord = null;
        let score = 0;
        let total = 0;
        let answered = false;

        function init() {
            setupEventListeners();
            loadQuestion();
        }

        function setupEventListeners() {
            document.getElementById('nextBtn').addEventListener('click', loadQuestion);
            document.getElementById('listenBtn').addEventListener('click', pronounceCurrentWord);
            document.getElementById('submitBtn').addEventListener('click', checkWrittenAnswer);
            document.getElementById('answerInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkWrittenAnswer();
            });
        }

        function getRandomWord() {
            const words = Object.keys(wordData);
            return words[Math.floor(Math.random() * words.length)];
        }

        function getWrongWords(correctWord, count = 3) {
            const words = Object.keys(wordData).filter(w => w !== correctWord);
            const wrongWords = [];
            for (let i = 0; i < count; i++) {
                if (words.length === 0) break;
                const index = Math.floor(Math.random() * words.length);
                wrongWords.push(words.splice(index, 1)[0]);
            }
            return wrongWords;
        }

        function loadQuestion() {
            answered = false;
            mode = Math.floor(Math.random() * 3) + 1;
            const word = getRandomWord();
            currentWord = word;
            const data = wordData[word];
            const typeLabel = ['中文选英文', '英文选中文', '听音写单词'][mode - 1];

            document.getElementById('questionType').textContent = typeLabel;
            document.getElementById('feedback').classList.remove('show', 'correct', 'wrong');
            document.getElementById('nextBtn').style.display = 'none';

            if (mode === 1) {
                showChineseToEnglish(word, data);
            } else if (mode === 2) {
                showEnglishToChinese(word, data);
            } else {
                showListenToWrite(word, data);
            }
        }

        function showChineseToEnglish(word, data) {
            document.getElementById('question').textContent = data.meaning;
            document.getElementById('phonetic').textContent = '';
            document.getElementById('listenBtn').style.display = 'none';
            document.getElementById('options').style.display = 'grid';
            document.getElementById('inputContainer').style.display = 'none';

            const wrongWords = getWrongWords(word);
            const options = [word, ...wrongWords];
            shuffle(options);

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = options.map(w => `
                <div class="option" data-word="${w}">${w}</div>
            `).join('');

            optionsContainer.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    pronounceWord(opt.dataset.word);
                    setTimeout(() => checkAnswer(opt.dataset.word), 600);
                });
            });
        }

        function showEnglishToChinese(word, data) {
            document.getElementById('question').textContent = word;
            document.getElementById('phonetic').textContent = data.phonetic;
            document.getElementById('listenBtn').style.display = 'none';
            document.getElementById('options').style.display = 'grid';
            document.getElementById('inputContainer').style.display = 'none';

            const wrongWords = getWrongWords(word);
            const options = [data.meaning, ...wrongWords.map(w => wordData[w].meaning)];
            shuffle(options);

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = options.map(m => `
                <div class="option" data-meaning="${m}">${m}</div>
            `).join('');

            optionsContainer.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => checkMeaning(opt.dataset.meaning));
            });

            setTimeout(pronounceCurrentWord, 500);
        }

        function showListenToWrite(word, data) {
            document.getElementById('question').textContent = '听发音，写单词';
            document.getElementById('phonetic').textContent = '';
            document.getElementById('listenBtn').style.display = 'inline-flex';
            document.getElementById('options').style.display = 'none';
            document.getElementById('inputContainer').style.display = 'block';
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();

            setTimeout(pronounceCurrentWord, 500);
        }

        function pronounceWord(word) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                const voices = speechSynthesis.getVoices();
                const preferredVoice = voices.find(v =>
                    v.lang === 'en-US' &&
                    (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Female'))
                );
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }
                speechSynthesis.speak(utterance);
            }
        }

        function pronounceCurrentWord() {
            pronounceWord(currentWord);
        }

        function checkAnswer(selectedWord) {
            if (answered) return;
            answered = true;
            total++;
            const isCorrect = selectedWord === currentWord;
            if (isCorrect) score++;
            showResult(isCorrect);
        }

        function checkMeaning(selectedMeaning) {
            if (answered) return;
            answered = true;
            total++;
            const isCorrect = selectedMeaning === wordData[currentWord].meaning;
            if (isCorrect) score++;
            showResult(isCorrect);
        }

        function checkWrittenAnswer() {
            if (answered) return;
            const input = document.getElementById('answerInput').value.trim().toLowerCase();
            answered = true;
            total++;
            const isCorrect = input === currentWord.toLowerCase();
            if (isCorrect) score++;
            showResult(isCorrect);
        }

        function showResult(isCorrect) {
            const feedback = document.getElementById('feedback');
            feedback.classList.add('show', isCorrect ? 'correct' : 'wrong');
            document.getElementById('feedbackTitle').textContent = isCorrect ? '✓ 正确！' : '✗ 错误';
            document.getElementById('feedbackText').textContent = `${currentWord} ${wordData[currentWord].phonetic} - ${wordData[currentWord].meaning}`;

            document.getElementById('score').textContent = score;
            document.getElementById('total').textContent = total;
            document.getElementById('accuracy').textContent = total > 0 ? Math.round(score / total * 100) + '%' : '0%';

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
