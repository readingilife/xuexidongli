<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挑战单词 - Basic English 850</title>
    <link rel="icon" type="image/svg+xml" href="../icon/学习.svg">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #48bb78;
            --error: #f56565;
            --warning: #ed8936;
            --text: #2d3748;
            --text-light: #718096;
            --bg: #f7fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #edf2f7 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-light);
            font-size: 16px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 40px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .setting-item {
            background: #f7fafc;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--border);
        }

        .setting-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .setting-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 18px;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
            text-align: center;
        }

        .setting-input:focus {
            border-color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            opacity: 0.9;
        }

        .start-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .progress-section {
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 12px;
            background: var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 6px;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .question-type {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .question {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.4;
            text-align: center;
        }

        .question-phonetic {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 20px;
            text-align: center;
        }

        .example-sentence {
            background: #f7fafc;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .example-en {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .example-cn {
            font-size: 14px;
            color: var(--text-light);
        }

        .listen-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto 20px auto;
            transition: all 0.3s;
        }

        .listen-btn:hover {
            transform: scale(1.05);
        }

        .clickable-text {
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: inline-block;
        }

        .clickable-text:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .clickable-text::after {
            content: '🔊';
            margin-left: 4px;
            font-size: 0.8em;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .clickable-text:hover::after {
            opacity: 1;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .option {
            padding: 18px;
            border: 2px solid var(--border);
            background: var(--card);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .option:hover:not(.correct):not(.wrong) {
            border-color: var(--primary);
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .option.correct {
            border-color: var(--success);
            background: #f0fff4;
            color: #22543d;
        }

        .option.wrong {
            border-color: var(--error);
            background: #fff5f5;
            color: #742a2a;
        }

        .input-container {
            margin-top: 30px;
        }

        .input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
            text-align: center;
        }

        .input:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            margin-top: 15px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .word-detail {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border-radius: 15px;
            text-align: center;
        }

        .word-detail-word {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .word-detail-phonetic {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 15px;
        }

        .word-detail-meaning {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .word-detail-examples {
            margin-top: 20px;
        }

        .word-detail-example {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn:hover {
            transform: translateY(-2px);
        }

        .back-btn {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #f0f4ff;
        }

        .centered {
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px;
            }

            .question {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 挑战单词</h1>
            <p>Basic English 850 - 系统化背单词</p>
        </div>

        <div id="homePage" class="page active">
            <div class="card">
                <div class="section-title">⚙️ 今日计划</div>
                <div class="settings-grid">
                    <div class="setting-item">
                        <div class="setting-label">学习新单词</div>
                        <input type="number" id="newWordCount" class="setting-input" value="10" min="1" max="50">
                    </div>
                    <div class="setting-item">
                        <div class="setting-label">复习旧单词</div>
                        <input type="number" id="reviewWordCount" class="setting-input" value="10" min="0" max="50">
                    </div>
                </div>

                <div class="section-title">📊 学习进度</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="masteredCount">0</div>
                        <div class="stat-label">已掌握</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalWords">0</div>
                        <div class="stat-label">总单词</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="masteredPercent">0%</div>
                        <div class="stat-label">掌握率</div>
                    </div>
                </div>

                <button id="startBtn" class="start-btn">开始学习 →</button>
            </div>

            <div class="card">
                <div class="section-title">💡 使用说明</div>
                <ul style="line-height: 2; color: var(--text-light); padding-left: 20px;">
                    <li>连续答对3次，单词标记为"已掌握"</li>
                    <li>五种题型随机出现，全方位记忆</li>
                    <li>学习进度会自动保存到本地</li>
                </ul>
            </div>
        </div>

        <div id="quizPage" class="page">
            <div class="card">
                <div class="progress-section">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="progressText">1 / 20</div>
                </div>

                <div class="centered">
                    <div class="question-type" id="questionType">中文选英文</div>
                </div>

                <div class="question" id="question"></div>
                <div class="question-phonetic" id="phonetic"></div>

                <div class="options" id="options"></div>

                <div class="word-detail" id="wordDetail" style="display: none;">
                    <div class="word-detail-word" id="detailWord"></div>
                    <div class="word-detail-phonetic" id="detailPhonetic"></div>
                    <div class="word-detail-meaning" id="detailMeaning"></div>
                    <div class="word-detail-examples" id="detailExamples"></div>
                </div>

                <div id="nextBtnContainer" style="display: none;">
                    <button class="next-btn" id="nextBtn">下一题 →</button>
                </div>

                <div id="backBtnContainer" style="display: none;">
                    <button class="back-btn" id="backBtn">返回首页</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let wordData = [];
        let learningProgress = {};
        let currentSession = {
            words: [],
            currentIndex: 0,
            currentWord: null,
            answered: false
        };

        function init() {
            loadWordData();
            loadLearningProgress();
            setupEventListeners();
            updateStats();
        }

        async function loadWordData() {
            try {
                const response = await fetch('basic_english_850_data.json');
                wordData = await response.json();
            } catch (e) {
                console.log('使用内置数据');
                wordData = generateFallbackData();
            }
        }

        function generateFallbackData() {
            return Object.keys(getFallbackWordData()).map(word => ({
                word: word,
                phonetic: getFallbackWordData()[word].phonetic,
                meaning: getFallbackWordData()[word].meaning,
                examples: [
                    { en: `This is the word "${word}".`, cn: `这是单词"${word}"。` },
                    { en: `Let's learn "${word}" together.`, cn: `让我们一起学习"${word}"。` }
                ],
                category: 'General'
            }));
        }

        function getFallbackWordData() {
            return {
                'account': { phonetic: '/əˈkaʊnt/', meaning: '账户；描述；说明' },
                'act': { phonetic: '/ækt/', meaning: '行动；表现；法案' },
                'come': { phonetic: '/kʌm/', meaning: '来；到来' },
                'get': { phonetic: '/get/', meaning: '得到；获得' },
                'give': { phonetic: '/ɡɪv/', meaning: '给；给予' },
                'go': { phonetic: '/ɡəʊ/', meaning: '去；走' },
                'have': { phonetic: '/hæv/', meaning: '有；拥有' },
                'make': { phonetic: '/meɪk/', meaning: '制作；使得' },
                'say': { phonetic: '/seɪ/', meaning: '说；讲' },
                'see': { phonetic: '/siː/', meaning: '看；看见' }
            };
        }

        function loadLearningProgress() {
            const saved = localStorage.getItem('basicEnglish850_progress');
            if (saved) {
                learningProgress = JSON.parse(saved);
            }
        }

        function saveLearningProgress() {
            localStorage.setItem('basicEnglish850_progress', JSON.stringify(learningProgress));
        }

        function setupEventListeners() {
            document.getElementById('startBtn').addEventListener('click', startSession);
            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
            document.getElementById('backBtn').addEventListener('click', goHome);

            document.addEventListener('click', (e) => {
                const clickable = e.target.closest('.clickable-text');
                if (clickable) {
                    e.stopPropagation();
                    const speakText = clickable.innerText || clickable.textContent;
                    if (speakText) {
                        pronounceText(speakText);
                    }
                }
            });
        }

        function updateStats() {
            const masteredCount = Object.values(learningProgress).filter(p => p.mastered).length;
            const totalCount = wordData.length || 850;
            const percent = totalCount > 0 ? Math.round((masteredCount / totalCount) * 100) : 0;

            document.getElementById('masteredCount').textContent = masteredCount;
            document.getElementById('totalWords').textContent = totalCount;
            document.getElementById('masteredPercent').textContent = percent + '%';
        }

        function getWordProgress(word) {
            if (!learningProgress[word]) {
                learningProgress[word] = { streak: 0, mastered: false, reviewCount: 0 };
            }
            return learningProgress[word];
        }

        function selectWordsForSession(newCount, reviewCount) {
            const allWords = [...wordData];
            shuffle(allWords);

            const newWords = allWords.filter(w => {
                const progress = getWordProgress(w.word);
                return progress.streak === 0;
            }).slice(0, newCount);

            const reviewWords = allWords.filter(w => {
                const progress = getWordProgress(w.word);
                return progress.streak > 0 && !progress.mastered;
            }).slice(0, reviewCount);

            const sessionWords = [...newWords, ...reviewWords];
            shuffle(sessionWords);
            return sessionWords;
        }

        function startSession() {
            const newCount = parseInt(document.getElementById('newWordCount').value) || 10;
            const reviewCount = parseInt(document.getElementById('reviewWordCount').value) || 10;

            currentSession.words = selectWordsForSession(newCount, reviewCount);
            if (currentSession.words.length === 0) {
                alert('恭喜！今天没有需要学习的单词了！');
                return;
            }

            currentSession.currentIndex = 0;
            currentSession.answered = false;

            showPage('quizPage');
            loadQuestion();
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function loadQuestion() {
            if (currentSession.currentIndex >= currentSession.words.length) {
                showSessionComplete();
                return;
            }

            currentSession.answered = false;
            currentSession.currentWord = currentSession.words[currentSession.currentIndex];

            updateProgressBar();
            resetQuestionDisplay();

            const questionTypes = [2, 3];
            const mode = questionTypes[Math.floor(Math.random() * questionTypes.length)];

            switch (mode) {
                case 2: showChineseToEnglish(); break;
                case 3: showEnglishToChinese(); break;
            }
        }

        function updateProgressBar() {
            const total = currentSession.words.length;
            const current = currentSession.currentIndex + 1;
            const percent = (current / total) * 100;

            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = `${current} / ${total}`;
        }

        function resetQuestionDisplay() {
            document.getElementById('options').innerHTML = '';
            document.getElementById('options').style.display = 'grid';
            document.getElementById('wordDetail').style.display = 'none';
            document.getElementById('nextBtnContainer').style.display = 'none';
            document.getElementById('backBtnContainer').style.display = 'none';
        }

        function makeClickable(text, speakText) {
            return `<span class="clickable-text">${text}</span>`;
        }

        function showChineseToEnglish() {
            const word = currentSession.currentWord;
            document.getElementById('questionType').textContent = '中文→英文';
            document.getElementById('question').textContent = word.meaning;
            document.getElementById('phonetic').textContent = '';

            const wrongWords = getWrongWords(word.word, 3);
            const options = [word.word, ...wrongWords];
            shuffle(options);

            renderOptions(options, (selected) => {
                checkAnswer(selected === word.word);
            }, true);
        }

        function showEnglishToChinese() {
            const word = currentSession.currentWord;
            document.getElementById('questionType').textContent = '英文→中文';
            document.getElementById('question').innerHTML = makeClickable(word.word, word.word);
            document.getElementById('phonetic').textContent = word.phonetic;

            const wrongWords = getWrongWords(word.word, 3);
            const options = [word.meaning, ...wrongWords.map(w => {
                const wd = wordData.find(d => d.word === w);
                return wd ? wd.meaning : w;
            })];
            shuffle(options);

            renderOptions(options, (selected) => {
                checkAnswer(selected === word.meaning);
            });

            setTimeout(pronounceCurrentWord, 500);
        }



        function renderOptions(options, callback, makeSpeakable = false) {
            const container = document.getElementById('options');
            container.innerHTML = options.map(opt => {
                const displayText = makeSpeakable ? makeClickable(opt, opt) : opt;
                return `<div class="option" data-value="${opt}">${displayText}</div>`;
            }).join('');

            container.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    if (currentSession.answered) return;
                    if (e.target.classList.contains('clickable-text')) return;
                    const selected = opt.dataset.value;
                    const correctWord = currentSession.currentWord.word;
                    const correctMeaning = currentSession.currentWord.meaning;

                    options.forEach(o => {
                        const el = container.querySelector(`[data-value="${CSS.escape(o)}"]`);
                        if (el) {
                            if (o === correctWord || o === correctMeaning) {
                                el.classList.add('correct');
                            }
                        }
                    });

                    if (selected !== correctWord && selected !== correctMeaning) {
                        opt.classList.add('wrong');
                    }

                    callback(selected);
                });
            });
        }

        function getWrongWords(correctWord, count) {
            const words = wordData.filter(w => w.word !== correctWord).map(w => w.word);
            const wrongWords = [];
            for (let i = 0; i < count; i++) {
                if (words.length === 0) break;
                const index = Math.floor(Math.random() * words.length);
                wrongWords.push(words.splice(index, 1)[0]);
            }
            return wrongWords;
        }



        function checkAnswer(isCorrect) {
            if (currentSession.answered) return;
            currentSession.answered = true;

            const word = currentSession.currentWord.word;
            const progress = getWordProgress(word);

            if (isCorrect) {
                progress.streak++;
                if (progress.streak >= 3) {
                    progress.mastered = true;
                }
            } else {
                progress.streak = 0;
                progress.mastered = false;
            }

            progress.reviewCount++;
            saveLearningProgress();

            showWordDetail(isCorrect);
        }

        function showWordDetail(isCorrect) {
            const word = currentSession.currentWord;
            const progress = getWordProgress(word.word);

            document.getElementById('wordDetail').style.display = 'block';
            document.getElementById('detailWord').innerHTML = makeClickable(word.word, word.word);
            document.getElementById('detailPhonetic').textContent = word.phonetic;
            document.getElementById('detailMeaning').textContent = word.meaning;

            const examplesHtml = word.examples.map(ex => `
                <div class="word-detail-example">
                    <div style="font-weight: 600; margin-bottom: 5px;">${makeClickable(ex.en, ex.en)}</div>
                </div>
            `).join('');
            document.getElementById('detailExamples').innerHTML = examplesHtml;

            if (progress.mastered) {
                document.getElementById('detailMeaning').textContent = `🎉 ${word.meaning} - 已掌握！`;
            }

            document.getElementById('nextBtnContainer').style.display = 'block';
        }

        function nextQuestion() {
            currentSession.currentIndex++;
            loadQuestion();
        }

        function showSessionComplete() {
            document.getElementById('questionType').textContent = '学习完成！';
            document.getElementById('question').textContent = '太棒了！你完成了今天的学习';
            document.getElementById('phonetic').textContent = '';
            document.getElementById('options').style.display = 'none';
            document.getElementById('nextBtnContainer').style.display = 'none';
            document.getElementById('backBtnContainer').style.display = 'block';

            updateStats();
        }

        function goHome() {
            updateStats();
            showPage('homePage');
        }

        function pronounceText(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                
                const speak = () => {
                    const voices = speechSynthesis.getVoices();
                    const preferredVoice = voices.find(v =>
                        v.lang === 'en-US' &&
                        (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Female'))
                    );
                    if (preferredVoice) {
                        utterance.voice = preferredVoice;
                    }
                    speechSynthesis.speak(utterance);
                };
                
                if (speechSynthesis.getVoices().length > 0) {
                    speak();
                } else {
                    speechSynthesis.onvoiceschanged = speak;
                }
            }
        }

        function pronounceWord(word) {
            pronounceText(word);
        }

        function pronounceCurrentWord() {
            if (currentSession.currentWord) {
                pronounceWord(currentSession.currentWord.word);
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
