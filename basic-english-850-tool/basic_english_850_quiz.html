<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挑战单词 - Basic English 850</title>
    <link rel="icon" type="image/svg+xml" href="../icon/学习.svg">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #48bb78;
            --error: #f56565;
            --warning: #ed8936;
            --text: #2d3748;
            --text-light: #718096;
            --bg: #f7fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 0;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0 16px;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: var(--text-light);
            font-size: 13px;
            margin-top: 4px;
        }

        /* Pages */
        .page { display: none; }
        .page.active { display: block; }

        /* Card */
        .card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 12px;
        }

        /* ===== Today's Plan ===== */
        .plan-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .plan-items {
            display: flex;
            gap: 16px;
            flex: 1;
        }
        .plan-item {
            flex: 1;
            text-align: center;
        }
        .plan-item .plan-num {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .plan-item .plan-label {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 500;
        }
        .plan-settings-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: #f0f4ff;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .plan-settings-btn:active {
            transform: scale(0.92);
            background: #e2e8ff;
        }

        /* ===== Start Button ===== */
        .start-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .start-btn:active {
            transform: scale(0.97);
        }

        /* ===== Progress (compact) ===== */
        .progress-compact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }
        .progress-compact .progress-num {
            color: var(--primary);
            font-weight: 800;
        }
        .mini-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 13px;
        }
        .mini-stat {
            background: #f7fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .mini-stat strong {
            display: block;
            color: var(--primary);
            font-size: 22px;
            line-height: 1.1;
        }
        .mini-stat span { color: var(--text-light); }
        .progress-bar-mini {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            max-width: 120px;
        }
        .progress-bar-mini .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* ===== Settings Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-overlay.show { display: flex; }
        .modal-sheet {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 32px;
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-sheet h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-field {
            margin-bottom: 16px;
        }
        .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .modal-field input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid var(--border);
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-field input:focus {
            border-color: var(--primary);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .modal-cancel {
            background: #f0f4ff;
            color: var(--primary);
        }
        .modal-confirm {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .modal-cancel:active, .modal-confirm:active {
            transform: scale(0.97);
        }

        /* ===== Quiz Page ===== */
        .progress-section {
            margin-bottom: 16px;
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
            display: flex;
        }
        .progress-fill-correct {
            height: 100%;
            background: var(--success);
            transition: width 0.3s;
        }
        .progress-fill-wrong {
            height: 100%;
            background: var(--error);
            transition: width 0.3s;
        }
        .progress-fill-remaining {
            height: 100%;
            flex: 1;
            background: var(--border);
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-light);
            font-weight: 600;
        }
        .progress-stats {
            display: flex;
            gap: 10px;
        }
        .progress-stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .stat-correct { color: var(--success); }
        .stat-wrong { color: var(--error); }

        .question-type {
            display: inline-block;
            padding: 3px 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4;
            text-align: center;
        }
        .question-phonetic {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 16px;
            text-align: center;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .option {
            padding: 14px 10px;
            border: 2px solid var(--border);
            background: var(--card);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            word-break: break-word;
        }
        .option:active:not(.correct):not(.wrong) {
            transform: scale(0.97);
            border-color: var(--primary);
            background: #f0f4ff;
        }
        .option.correct {
            border-color: var(--success);
            background: #f0fff4;
            color: #22543d;
        }
        .option.wrong {
            border-color: var(--error);
            background: #fff5f5;
            color: #742a2a;
        }

        .word-detail {
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border-radius: 14px;
            text-align: center;
        }
        .word-detail-word {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .word-detail-phonetic {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 10px;
        }
        .word-detail-meaning {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .word-detail-examples { margin-top: 16px; }
        .study-steps {
            display: grid;
            gap: 8px;
            text-align: left;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 12px;
        }
        .study-step {
            background: white;
            border-radius: 10px;
            padding: 9px 10px;
        }
        .sound-btn {
            border: none;
            background: #edf2ff;
            color: var(--primary);
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            cursor: pointer;
            margin: 4px 0 10px;
        }
        .usage-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }
        .usage-chip {
            background: #edf2ff;
            color: var(--primary);
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: 700;
        }
        .word-detail-example {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .next-btn, .back-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .next-btn {
            margin-top: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .back-btn {
            margin-top: 10px;
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .next-btn:active, .back-btn:active {
            transform: scale(0.97);
        }
        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Result Page ===== */
        .result-header {
            text-align: center;
            padding: 10px 0 16px;
        }
        .result-header .result-emoji {
            font-size: 40px;
            margin-bottom: 8px;
        }
        .result-header h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .result-header .result-rate {
            font-size: 14px;
            color: var(--text-light);
        }
        .result-summary {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }
        .result-summary .rs-item {
            text-align: center;
        }
        .result-summary .rs-num {
            font-size: 24px;
            font-weight: 800;
        }
        .result-summary .rs-num.green { color: var(--success); }
        .result-summary .rs-num.red { color: var(--error); }
        .result-summary .rs-label {
            font-size: 12px;
            color: var(--text-light);
        }
        .result-word-list {
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .parent-card {
            border: 1px solid var(--border);
            background: #fffaf0;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .parent-card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
        }
        .parent-card button {
            border: none;
            border-radius: 999px;
            padding: 5px 9px;
            background: white;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
        }
        .parent-tip {
            color: var(--text-light);
            margin-top: 6px;
            line-height: 1.5;
        }
        .result-word-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .result-word-item:last-child { border-bottom: none; }
        .result-word-item .rw-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .result-word-item .rw-icon.correct {
            background: #f0fff4;
            color: var(--success);
        }
        .result-word-item .rw-icon.wrong {
            background: #fff5f5;
            color: var(--error);
        }
        .result-word-item .rw-word {
            font-weight: 700;
            color: var(--text);
        }
        .result-word-item .rw-phonetic {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-light);
            margin-left: 4px;
        }
        .result-word-item .rw-info {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .result-word-item .rw-info:active {
            opacity: 0.6;
        }
        .result-word-item .rw-meaning {
            color: var(--text-light);
            font-size: 13px;
        }

        .centered { text-align: center; }
        .hidden { display: none !important; }

        .clickable-text {
            cursor: pointer;
            transition: color 0.2s;
        }
        .clickable-text:hover { color: var(--primary); }
        .clickable-text::after {
            content: '🔊';
            margin-left: 3px;
            font-size: 0.75em;
            opacity: 0.6;
        }

        /* Usage tips - compact */
        .tips {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.8;
            padding-left: 16px;
        }
        button:focus-visible, input:focus-visible {
            outline: 3px solid #f6ad55;
            outline-offset: 3px;
        }
        .start-btn:disabled { opacity: 0.45; cursor: wait; }
        .load-status {
            margin: 8px 0 12px;
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
        }
        .load-status.error { color: var(--error); }
        .option {
            width: 100%;
            min-height: 52px;
            font: inherit;
        }
        .spelling-form { display: grid; gap: 10px; text-align: left; }
        .spelling-form label { color: var(--text-light); font-size: 13px; }
        .spelling-form input {
            width: 100%;
            min-height: 52px;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 20px;
        }
        .example-button, .result-word-button {
            width: 100%;
            border: 0;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }
        .example-button {
            background: white;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
        }
        .speak-question { cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>挑战单词</h1>
            <p>Ogden 核心词 · 小学生分级练习</p>
        </div>

        <!-- ===== Home Page ===== -->
        <div id="homePage" class="page active">
            <!-- Today's Plan -->
            <div class="card">
                <div class="plan-section">
                    <div class="plan-items">
                        <div class="plan-item">
                            <div class="plan-num" id="planNew">5</div>
                            <div class="plan-label">新学</div>
                        </div>
                        <div class="plan-item">
                            <div class="plan-num" id="planReview">10</div>
                            <div class="plan-label">复习</div>
                        </div>
                    </div>
                    <button class="plan-settings-btn" onclick="showSettings()">⚙️</button>
                </div>
            </div>

            <!-- Start Button -->
            <div style="margin-bottom: 12px;">
                <button id="startBtn" class="start-btn">开始学习 →</button>
            </div>

            <div class="card">
                <div class="mini-stats">
                    <div class="mini-stat">
                        <strong id="rescueCountHome">0</strong>
                        <span>待救回错词</span>
                    </div>
                    <div class="mini-stat">
                        <strong id="estimateMinutes">8</strong>
                        <span>预计分钟</span>
                    </div>
                </div>
            </div>

            <!-- Progress (compact) -->
            <div class="card">
                <div class="progress-compact">
                    <span>已掌握 <span class="progress-num" id="masteredCount">0</span>/<span id="totalWordCount">850</span></span>
                    <div class="progress-bar-mini">
                        <div class="fill" id="progressFillHome" style="width: 0%"></div>
                    </div>
                    <span>掌握度 <span class="progress-num" id="masteredPercent">0%</span></span>
                </div>
            </div>

            <!-- Tips -->
            <div class="card">
                <ul class="tips">
                    <li>新词会先认识、再练习、稍后复测</li>
                    <li>答错的词会在本轮和下次优先复习</li>
                    <li>跨日期多次答对后才会标记为掌握</li>
                    <li>学习进度自动保存到本地</li>
                </ul>
            </div>
        </div>

        <!-- ===== Quiz Page ===== -->
        <div id="quizPage" class="page">
            <div class="card">
                <div class="progress-section">
                    <div class="progress-bar">
                        <div class="progress-fill-correct" id="progressCorrect" style="width: 0%"></div>
                        <div class="progress-fill-wrong" id="progressWrong" style="width: 0%"></div>
                        <div class="progress-fill-remaining"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progressCount">1 / 20</span>
                        <div class="progress-stats">
                            <span class="stat-correct">✓ <span id="correctCount">0</span></span>
                            <span class="stat-wrong">✗ <span id="wrongCount">0</span></span>
                        </div>
                    </div>
                </div>

                <div class="centered">
                    <div class="question-type" id="questionType">中文选英文</div>
                </div>

                <div class="question" id="question"></div>
                <div class="question-phonetic" id="phonetic"></div>

                <div class="options" id="options"></div>

                <div class="word-detail" id="wordDetail" style="display: none;">
                    <div class="word-detail-word" id="detailWord"></div>
                    <div class="word-detail-phonetic" id="detailPhonetic"></div>
                    <div class="word-detail-meaning" id="detailMeaning"></div>
                    <div class="word-detail-examples" id="detailExamples"></div>
                </div>

                <div id="nextBtnContainer" style="display: none;">
                    <button class="next-btn" id="nextBtn">下一题 →</button>
                </div>
                <div id="backBtnContainer" style="display: none;">
                    <button class="back-btn" id="backBtn">返回首页</button>
                </div>
            </div>
        </div>

        <!-- ===== Result Page ===== -->
        <div id="resultPage" class="page">
            <div class="card">
                <div class="result-header">
                    <div class="result-emoji" id="resultEmoji">🎉</div>
                    <h2 id="resultTitle">学习完成！</h2>
                    <div class="result-rate" id="resultRate">正确率 0%</div>
                </div>
                <div class="result-summary">
                    <div class="rs-item">
                        <div class="rs-num green" id="resultCorrect">0</div>
                        <div class="rs-label">正确</div>
                    </div>
                    <div class="rs-item">
                        <div class="rs-num red" id="resultWrong">0</div>
                        <div class="rs-label">错误</div>
                    </div>
                    <div class="rs-item">
                        <div class="rs-num" id="resultTotal" style="color:var(--primary);">0</div>
                        <div class="rs-label">总题数</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="section-title" style="font-size:16px;margin-bottom:12px;">本次单词</div>
                <div class="result-word-list" id="resultWordList"></div>
            </div>
            <div class="card">
                <div class="section-title" style="font-size:16px;margin-bottom:12px;">今日 3 词陪练卡</div>
                <div id="parentPracticeList"></div>
            </div>
            <div style="margin-bottom:12px;">
                <button class="start-btn" onclick="goHome()">返回首页</button>
            </div>
        </div>
    </div>

    <!-- ===== Settings Modal (Bottom Sheet) ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <h3>今日计划设置</h3>
            <div class="modal-field">
                <label>学习新单词数</label>
                <input type="number" id="settingNewCount" min="1" max="20" value="5">
            </div>
            <div class="modal-field">
                <label>复习旧单词数</label>
                <input type="number" id="settingReviewCount" min="0" max="30" value="10">
            </div>
            <div class="modal-actions">
                <button class="modal-cancel" onclick="hideSettings()">取消</button>
                <button class="modal-confirm" onclick="confirmSettings()">确定</button>
            </div>
        </div>
    </div>
